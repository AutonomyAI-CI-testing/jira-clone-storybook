<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" fill="none">

  <!-- WAND LINE (behind arm) -->
  <line x1="80" y1="145" x2="145" y2="248" stroke="#3a2010" stroke-width="5" stroke-linecap="round"/>

  <!-- LEFT GLOVE (raised, holding wand) -->
  <ellipse cx="147" cy="254" rx="20" ry="18" fill="#f5eed8" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Glove outline -->
  <path d="M133,257 Q140,269 147,272 Q154,269 161,257" fill="none" stroke="#2a1f1a" stroke-width="2.5"/>

  <!-- LEFT ARM RAISED (brown, thick) -->
  <path d="M183,302 Q165,282 148,257" stroke="#7a5428" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M183,302 Q165,282 148,257" stroke="#2a1f1a" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.12"/>

  <!-- RIGHT ARM (hanging by side, angled slightly out) -->
  <path d="M292,300 Q308,318 316,345" stroke="#7a5428" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M292,300 Q308,318 316,345" stroke="#2a1f1a" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.12"/>

  <!-- RIGHT GLOVE -->
  <ellipse cx="320" cy="352" rx="20" ry="18" fill="#f5eed8" stroke="#2a1f1a" stroke-width="4"/>
  <path d="M306,354 Q313,366 320,368 Q327,366 334,354" fill="none" stroke="#2a1f1a" stroke-width="2.5"/>

  <!-- ===== WIZARD HAT ===== -->
  <!-- Hat BRIM - very wide, prominent, like reference -->
  <ellipse cx="225" cy="230" rx="130" ry="28" fill="#3b5f8a" stroke="#2a1f1a" stroke-width="5"/>
  <!-- Brim inner shadow -->
  <ellipse cx="225" cy="230" rx="118" ry="20" fill="#2a4a6e" opacity="0.4"/>
  <!-- Brim highlight top -->
  <ellipse cx="218" cy="223" rx="110" ry="12" fill="#4a72a0" opacity="0.35"/>

  <!-- Hat cone (wide at base, narrow at top, slightly left-leaning tip) -->
  <path d="M148 232 L207 52 Q225 8 248 52 L306 232 Z" fill="#3b5f8a" stroke="#2a1f1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hat shading (left side darker) -->
  <path d="M148 232 L207 52 Q202 90 200 140 L165 232 Z" fill="#2a4a6e" opacity="0.3"/>
  <!-- Hat shading (right - slightly lighter section) -->
  <path d="M260 232 L285 232 Q306 232 306 232 L248 52 Q242 90 242 135 Z" fill="#4a72a0" opacity="0.2"/>

  <!-- Hat TIP CURL (flopped right) -->
  <path d="M246 54 Q265 22 283 36 Q292 48 273 60 Q258 68 246 54 Z" fill="#4a72a0" stroke="#2a1f1a" stroke-width="4"/>

  <!-- Hat decorations - 2 STARS + 2 CRESCENT MOONS -->
  <!-- Large star lower-left -->
  <polygon points="182,145 187,162 204,162 191,172 196,189 182,179 168,189 173,172 160,162 177,162" fill="#f5c842" stroke="#c8950a" stroke-width="2"/>
  <!-- Small star upper-center -->
  <polygon points="228,68 231,78 241,78 233,84 236,94 228,88 220,94 223,84 215,78 225,78" fill="#f5c842" stroke="#c8950a" stroke-width="1.5"/>
  <!-- Crescent moon upper-right -->
  <path d="M261,85 A22,22 0 0,1 261,118 A16,16 0 0,0 261,85 Z" fill="#f5c842" stroke="#c8950a" stroke-width="1.5"/>
  <!-- Crescent moon right-middle -->
  <path d="M270,148 A18,18 0 0,1 270,175 A13,13 0 0,0 270,148 Z" fill="#f5c842" stroke="#c8950a" stroke-width="1.5"/>

  <!-- ===== ROBOT HEAD ===== -->
  <!-- Head main (beige/tan, rounded rect) -->
  <rect x="160" y="195" width="130" height="100" rx="26" fill="#ead598" stroke="#2a1f1a" stroke-width="5"/>

  <!-- Left ear panel (brown rounded rect) -->
  <rect x="133" y="208" width="30" height="52" rx="12" fill="#a07840" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Left ear inner -->
  <rect x="139" y="216" width="18" height="36" rx="7" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>

  <!-- Right ear panel (brown rounded rect) -->
  <rect x="287" y="208" width="30" height="52" rx="12" fill="#a07840" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Right ear inner -->
  <rect x="293" y="216" width="18" height="36" rx="7" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>

  <!-- FACE SCREEN (green, fills most of head front) -->
  <rect x="174" y="203" width="102" height="80" rx="16" fill="#7ec040" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Screen highlight top strip -->
  <rect x="180" y="207" width="90" height="16" rx="8" fill="#a0d860" opacity="0.5"/>

  <!-- EYES (dark oval) -->
  <ellipse cx="200" cy="238" rx="10" ry="12" fill="#2e1a10"/>
  <ellipse cx="250" cy="238" rx="10" ry="12" fill="#2e1a10"/>
  <!-- Eye shine dots -->
  <ellipse cx="196" cy="233" rx="3.5" ry="3.5" fill="white" opacity="0.6"/>
  <ellipse cx="246" cy="233" rx="3.5" ry="3.5" fill="white" opacity="0.6"/>

  <!-- SMILE -->
  <path d="M202 257 Q225 272 248 257" stroke="#2e1a10" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- ===== ROBOT NECK ===== -->
  <rect x="196" y="293" width="58" height="26" rx="7" fill="#c4a870" stroke="#2a1f1a" stroke-width="4"/>

  <!-- ===== ROBOT BODY ===== -->
  <rect x="152" y="314" width="146" height="148" rx="32" fill="#ead598" stroke="#2a1f1a" stroke-width="5"/>
  <!-- Body lighter inner panel -->
  <rect x="168" y="330" width="114" height="110" rx="20" fill="#f2e0ac" opacity="0.6"/>

  <!-- CHEST EMBLEM (headphone/binocular shape like reference) -->
  <!-- Left cup -->
  <ellipse cx="196" cy="395" rx="22" ry="20" fill="#a07840" stroke="#2a1f1a" stroke-width="3.5"/>
  <ellipse cx="196" cy="395" rx="14" ry="13" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>
  <!-- Right cup -->
  <ellipse cx="254" cy="395" rx="22" ry="20" fill="#a07840" stroke="#2a1f1a" stroke-width="3.5"/>
  <ellipse cx="254" cy="395" rx="14" ry="13" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>
  <!-- Center bridge -->
  <rect x="206" y="389" width="38" height="12" rx="6" fill="#a07840" stroke="#2a1f1a" stroke-width="3"/>
  <!-- Center ball -->
  <circle cx="225" cy="395" r="10" fill="#b08040" stroke="#2a1f1a" stroke-width="3"/>
  <circle cx="221" cy="391" r="3.5" fill="#d4aa62" opacity="0.55"/>

  <!-- ===== LEGS (short & chunky) ===== -->
  <!-- Left leg (brown segments) -->
  <rect x="175" y="456" width="40" height="38" rx="10" fill="#a07840" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Left ankle wraps -->
  <rect x="175" y="476" width="40" height="8" rx="4" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>
  <!-- Left boot -->
  <ellipse cx="195" cy="500" rx="30" ry="16" fill="#7a5028" stroke="#2a1f1a" stroke-width="4"/>
  <rect x="167" y="490" width="56" height="20" rx="10" fill="#7a5028" stroke="#2a1f1a" stroke-width="4"/>
  <rect x="172" y="492" width="46" height="8" rx="4" fill="#9a6838" opacity="0.5"/>

  <!-- Right leg -->
  <rect x="235" y="456" width="40" height="38" rx="10" fill="#a07840" stroke="#2a1f1a" stroke-width="4"/>
  <!-- Right ankle wraps -->
  <rect x="235" y="476" width="40" height="8" rx="4" fill="#8a6030" stroke="#2a1f1a" stroke-width="2"/>
  <!-- Right boot -->
  <ellipse cx="255" cy="500" rx="30" ry="16" fill="#7a5028" stroke="#2a1f1a" stroke-width="4"/>
  <rect x="227" y="490" width="56" height="20" rx="10" fill="#7a5028" stroke="#2a1f1a" stroke-width="4"/>
  <rect x="232" y="492" width="46" height="8" rx="4" fill="#9a6838" opacity="0.5"/>

</svg>
