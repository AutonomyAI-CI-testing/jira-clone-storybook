<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 530" fill="none">

  <!-- ============================================================
       WAND STICK — long thin diagonal from far upper-left down to glove
       ============================================================ -->
  <line x1="45" y1="90" x2="175" y2="248" stroke="#2a1506" stroke-width="5" stroke-linecap="round"/>

  <!-- ============================================================
       LEFT ARM — raised high, extending clearly to the LEFT
       Upper arm going from shoulder upward-left
       ============================================================ -->
  <!-- Upper arm (going UP and LEFT from shoulder) -->
  <rect x="88" y="195" width="32" height="72" rx="14" fill="#c8924a" stroke="#2a1506" stroke-width="4"
        transform="rotate(-55, 104, 231)"/>
  <!-- Elbow joint -->
  <circle cx="112" cy="196" r="14" fill="#b07838" stroke="#2a1506" stroke-width="4"/>
  <!-- Forearm going down-left from elbow toward glove -->
  <rect x="94" y="200" width="30" height="60" rx="13" fill="#c8924a" stroke="#2a1506" stroke-width="4"
        transform="rotate(-25, 109, 230)"/>

  <!-- ============================================================
       LEFT GLOVE — big cream mitt holding the wand, ~(172,250)
       ============================================================ -->
  <ellipse cx="172" cy="252" rx="24" ry="22" fill="#f5f0d8" stroke="#2a1506" stroke-width="4.5"/>
  <!-- Thumb (upper-left side) -->
  <ellipse cx="153" cy="242" rx="13" ry="10" fill="#f5f0d8" stroke="#2a1506" stroke-width="4"
           transform="rotate(-25,153,242)"/>
  <!-- Highlight -->
  <ellipse cx="165" cy="245" rx="11" ry="8" fill="#fffbe8" opacity="0.7"/>

  <!-- ============================================================
       WIZARD HAT
       ============================================================ -->
  <!-- Hat brim dark underside -->
  <ellipse cx="240" cy="172" rx="122" ry="27" fill="#1a3050" stroke="#0d1d30" stroke-width="4.5"/>
  <!-- Hat cone body — tall, slightly left-leaning -->
  <path d="M130,172 L182,42 Q202,0 236,16 L348,172 Z" fill="#3d5f8a" stroke="#1a2d44" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hat shadow on left face -->
  <path d="M130,172 L182,42 Q195,12 215,10 L185,172 Z" fill="#2d4872" opacity="0.5"/>
  <!-- Hat tip droop/curl to the right -->
  <path d="M236,16 Q282,-10 298,18 Q288,52 266,62 Q248,50 236,16 Z" fill="#2d4872" stroke="#1a2d44" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Hat brim top face -->
  <ellipse cx="240" cy="172" rx="122" ry="27" fill="#2d4872" stroke="#1a2d44" stroke-width="4.5"/>
  <!-- Brim highlight -->
  <ellipse cx="228" cy="167" rx="86" ry="14" fill="#3d5f8a" opacity="0.5"/>

  <!-- ==== HAT DECORATIONS — LARGE, prominent, matching reference ====
       Reference has: large 5-pt star upper center, LARGE crescent left-mid,
       LARGE crescent center (biggest), large 5-pt star lower-left,
       small crescent in tip area
       ==== -->

  <!-- Large 5-point star — upper center of cone -->
  <polygon points="218,44 225,66 248,66 230,80 237,102 218,88 199,102 206,80 188,66 211,66"
           fill="#f5c418" stroke="#c8960a" stroke-width="3" stroke-linejoin="round"/>

  <!-- LARGE crescent moon — left-mid of cone (tall, prominent) -->
  <path d="M162,76 C150,98 152,126 166,146 C175,158 188,164 202,163
           C188,155 178,140 176,122 C173,102 180,82 193,68
           C178,68 168,70 162,76 Z" fill="#f5c418" stroke="#c8960a" stroke-width="3"/>

  <!-- LARGE crescent moon — center of cone (biggest one) -->
  <path d="M208,118 C198,136 200,158 212,172 C220,180 230,184 242,183
           C230,176 222,164 220,150 C218,134 224,118 234,108
           C222,107 213,110 208,118 Z" fill="#f5c418" stroke="#c8960a" stroke-width="3"/>

  <!-- Large 5-point star — lower-left of cone -->
  <polygon points="168,140 174,158 193,158 178,169 184,187 168,176 152,187 158,169 143,158 162,158"
           fill="#f5c418" stroke="#c8960a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Small crescent — in tip droop -->
  <path d="M256,20 C248,28 248,40 254,48 C258,53 264,56 271,55
           C265,52 261,46 261,38 C261,30 265,24 271,20
           C264,18 259,17 256,20 Z" fill="#f5c418" stroke="#c8960a" stroke-width="2.5"/>

  <!-- ============================================================
       ROBOT NECK
       ============================================================ -->
  <rect x="210" y="192" width="48" height="20" rx="6" fill="#b07838" stroke="#2a1506" stroke-width="3.5"/>

  <!-- ============================================================
       SHOULDER PADS (brown, prominent, rounded-rect)
       ============================================================ -->
  <!-- Left shoulder pad -->
  <rect x="138" y="206" width="52" height="44" rx="16" fill="#b07838" stroke="#2a1506" stroke-width="4"/>
  <ellipse cx="164" cy="221" rx="20" ry="9" fill="#c8924a" opacity="0.55"/>
  <!-- Right shoulder pad -->
  <rect x="278" y="206" width="52" height="44" rx="16" fill="#b07838" stroke="#2a1506" stroke-width="4"/>
  <ellipse cx="304" cy="221" rx="20" ry="9" fill="#c8924a" opacity="0.55"/>

  <!-- ============================================================
       RIGHT ARM — hanging down beside body, slightly angled out
       ============================================================ -->
  <!-- Upper right arm -->
  <rect x="328" y="234" width="32" height="56" rx="14" fill="#c8924a" stroke="#2a1506" stroke-width="4"/>
  <!-- Elbow joint knob -->
  <circle cx="344" cy="288" r="13" fill="#b07838" stroke="#2a1506" stroke-width="3.5"/>
  <!-- Forearm (slightly angled outward) -->
  <rect x="330" y="283" width="32" height="56" rx="13" fill="#c8924a" stroke="#2a1506" stroke-width="4"
        transform="rotate(10, 346, 311)"/>

  <!-- RIGHT GLOVE — big cream mitt, hanging, round mitten shape -->
  <ellipse cx="348" cy="348" rx="24" ry="22" fill="#f5f0d8" stroke="#2a1506" stroke-width="4.5"/>
  <!-- Thumb bump (right side) -->
  <ellipse cx="366" cy="340" rx="13" ry="10" fill="#f5f0d8" stroke="#2a1506" stroke-width="4"
           transform="rotate(20,366,340)"/>
  <!-- Glove highlight -->
  <ellipse cx="340" cy="341" rx="11" ry="8" fill="#fffbe8" opacity="0.7"/>

  <!-- ============================================================
       ROBOT HEAD / FACE BOX
       ============================================================ -->
  <rect x="162" y="194" width="144" height="112" rx="22" fill="#d4a96a" stroke="#2a1506" stroke-width="4.5"/>
  <!-- Face screen (green) — lime-green per reference -->
  <rect x="176" y="205" width="116" height="90" rx="14" fill="#72c240" stroke="#2a1506" stroke-width="4"/>
  <!-- Screen top highlight stripe -->
  <rect x="181" y="209" width="112" height="22" rx="9" fill="#8ada56" opacity="0.5"/>

  <!-- Eyes — simple oval dots -->
  <ellipse cx="210" cy="248" rx="12" ry="14" fill="#2a1506"/>
  <ellipse cx="258" cy="248" rx="12" ry="14" fill="#2a1506"/>
  <!-- Eye shine -->
  <circle cx="215" cy="242" r="4.5" fill="white" opacity="0.7"/>
  <circle cx="263" cy="242" r="4.5" fill="white" opacity="0.7"/>

  <!-- Smile — single gentle arc -->
  <path d="M210,274 Q234,289 258,274" stroke="#2a1506" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- ============================================================
       ROBOT TORSO — wide, light cream/tan
       ============================================================ -->
  <rect x="154" y="301" width="160" height="114" rx="20" fill="#e8d8a8" stroke="#2a1506" stroke-width="4.5"/>

  <!-- CHEST EMBLEM — center sphere with two side tabs (like camera/headphone) -->
  <!-- Left tab -->
  <rect x="196" y="344" width="26" height="18" rx="9" fill="#b07838" stroke="#2a1506" stroke-width="3.5"/>
  <!-- Right tab -->
  <rect x="246" y="344" width="26" height="18" rx="9" fill="#b07838" stroke="#2a1506" stroke-width="3.5"/>
  <!-- Central circle/sphere (drawn on top of tabs) -->
  <circle cx="234" cy="353" r="24" fill="#c8924a" stroke="#2a1506" stroke-width="3.5"/>
  <circle cx="234" cy="353" r="15" fill="#a06828" stroke="#2a1506" stroke-width="3"/>
  <!-- Center sphere highlight -->
  <circle cx="228" cy="346" r="6" fill="#c8924a" opacity="0.7"/>

  <!-- ============================================================
       LEFT ARM lower section visible (left side of torso)
       Small visible part below shoulder pad
       ============================================================ -->
  <rect x="122" y="272" width="28" height="50" rx="12" fill="#c8924a" stroke="#2a1506" stroke-width="4"/>

  <!-- ============================================================
       LEGS — wide, brown, with ankle cuffs
       ============================================================ -->
  <!-- Left leg -->
  <rect x="178" y="410" width="44" height="56" rx="16" fill="#8a5c28" stroke="#2a1506" stroke-width="4"/>
  <!-- Right leg -->
  <rect x="246" y="410" width="44" height="56" rx="16" fill="#8a5c28" stroke="#2a1506" stroke-width="4"/>

  <!-- Ankle cuffs — two dark stripes per leg -->
  <rect x="174" y="442" width="52" height="11" rx="5" fill="#5a3518" stroke="#2a1506" stroke-width="3"/>
  <rect x="174" y="455" width="52" height="9" rx="4" fill="#5a3518" stroke="#2a1506" stroke-width="3"/>
  <rect x="242" y="442" width="52" height="11" rx="5" fill="#5a3518" stroke="#2a1506" stroke-width="3"/>
  <rect x="242" y="455" width="52" height="9" rx="4" fill="#5a3518" stroke="#2a1506" stroke-width="3"/>

  <!-- Boots/feet — wide rounded ellipses -->
  <ellipse cx="200" cy="470" rx="38" ry="18" fill="#6b4220" stroke="#2a1506" stroke-width="4"/>
  <ellipse cx="268" cy="470" rx="38" ry="18" fill="#6b4220" stroke="#2a1506" stroke-width="4"/>
  <!-- Boot highlights -->
  <ellipse cx="190" cy="464" rx="20" ry="8" fill="#8a5c28" opacity="0.45"/>
  <ellipse cx="258" cy="464" rx="20" ry="8" fill="#8a5c28" opacity="0.45"/>

</svg>
